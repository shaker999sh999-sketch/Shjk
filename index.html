<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم</title>
<style>
:root{--bg:#ffffff;--splash:#0b4d40;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#app{position:fixed;inset:0;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif}
#splash{position:fixed;inset:0;background:var(--splash);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;z-index:10}
#splash.hide{opacity:0;pointer-events:none}
#splash video{width:100%;height:100%;object-fit:cover}
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:5;box-sizing:border-box;padding:12px 10px;
background:linear-gradient(135deg,rgba(2,70,52,.94) 0%,rgba(4,110,80,.82) 50%,rgba(3,88,65,.94) 100%);
-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
border:1px solid rgba(255,255,255,.22);border-radius:33px;
box-shadow:0 12px 28px rgba(2,60,44,.35),inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}
#topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
#topbar .row{position:relative;direction:ltr;display:flex;justify-content:flex-start;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;direction:rtl;height:42px;padding:0 14px 0 6px;border-radius:21px;border:1px solid rgba(255,255,255,.38);
background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.10));color:#fff;font:700 14px/1 inherit;font-family:inherit;
box-shadow:0 4px 12px rgba(0,60,40,.18),inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background .15s ease}
.chip:active{transform:scale(.95);background:rgba(255,255,255,.3)}
.chip .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#047857;box-shadow:0 2px 6px rgba(0,60,40,.25)}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip span{text-shadow:0 1px 2px rgba(0,60,40,.35);letter-spacing:.2px}

/* الشخصية: داخل الشريط عند اليمين */
#ch{position:absolute;right:14px;bottom:5px;width:47px;height:56px;will-change:transform;pointer-events:none}
#chi{position:absolute;left:0;top:0;width:715px;height:860px;transform:scale(.0651);transform-origin:0 0}
#chi img{position:absolute;display:block;max-width:none}
/* سحابة الكلام */
#bub{position:fixed;z-index:6;box-sizing:border-box;max-width:min(80vw,300px);padding:12px 18px;border-radius:26px;color:#fff;font:700 15px/1.7 inherit;font-family:system-ui,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
background:linear-gradient(135deg,#047857,#10b981);box-shadow:0 10px 24px rgba(4,120,87,.35),inset 0 1px 0 rgba(255,255,255,.35);
opacity:0;transform:translateY(-6px) scale(.92);transform-origin:var(--tx,50%) 0;transition:opacity .35s ease,transform .35s ease;pointer-events:none;visibility:hidden}
#bub.show{opacity:1;transform:none;visibility:visible}
#bub::before{content:"";position:absolute;top:-7px;left:calc(var(--tx,40px) - 8px);width:16px;height:16px;background:#0a8a66;transform:rotate(45deg);border-radius:3px}
</style>
</head>
<body>
<div id="app">
<header id="topbar"><div class="row">
<button class="chip" type="button"><span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span><span>حسابي</span></button>
<button class="chip" id="wallet" type="button"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a2 2 0 0 1 2 2v1"/><path d="M3 7.5V17a2.5 2.5 0 0 0 2.5 2.5H19a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 7.5z"/><circle cx="16.5" cy="13" r="1.2"/></svg></span><span>محفظتي</span></button>
</div>
<div id="ch"><div id="chi"></div></div>
</header>
<div id="bub"><span id="bt"></span></div>
</div>
