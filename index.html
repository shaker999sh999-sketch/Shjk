<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تم</title>
<style>
:root{--bg:#ffffff;--splash:#0b4d40;box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
#app{position:fixed;inset:0;background:var(--bg);font-family:system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif}
#splash{position:fixed;inset:0;background:var(--splash);display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;z-index:10}
#splash.hide{opacity:0;pointer-events:none}
#splash video{width:100%;height:100%;object-fit:cover}
#topbar{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;z-index:5;box-sizing:border-box;padding:12px 10px;
background:linear-gradient(135deg,rgba(2,70,52,.94) 0%,rgba(4,110,80,.82) 50%,rgba(3,88,65,.94) 100%);
-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
border:1px solid rgba(255,255,255,.22);border-radius:33px;
box-shadow:0 12px 28px rgba(2,60,44,.35),inset 0 1px 0 rgba(255,255,255,.3);overflow:hidden}
#topbar::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
#topbar .row{position:relative;direction:ltr;display:flex;justify-content:flex-start;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;direction:rtl;height:42px;padding:0 14px 0 6px;border-radius:21px;border:1px solid rgba(255,255,255,.38);
background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.10));color:#fff;font:700 14px/1 inherit;font-family:inherit;
box-shadow:0 4px 12px rgba(0,60,40,.18),inset 0 1px 0 rgba(255,255,255,.4);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,background .15s ease}
.chip:active{transform:scale(.95);background:rgba(255,255,255,.3)}
.chip .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.95);color:#047857;box-shadow:0 2px 6px rgba(0,60,40,.25)}
.chip svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.chip span{text-shadow:0 1px 2px rgba(0,60,40,.35);letter-spacing:.2px}

/* الشخصية: داخل الشريط عند اليمين */
#ch{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:27px;width:47px;height:56px;z-index:7;will-change:transform;transform-origin:50% 100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
#ch::after{content:"";position:absolute;inset:-8px}
#chi{position:absolute;left:0;top:0;width:715px;height:860px;transform:scale(.0651);transform-origin:0 0}
#chi img{position:absolute;display:block;max-width:none}
/* سحابة الكلام */
#bub{position:fixed;z-index:6;box-sizing:border-box;max-width:min(80vw,300px);padding:12px 18px;border-radius:26px;color:#fff;font:700 15px/1.7 inherit;font-family:system-ui,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;
background:linear-gradient(135deg,#047857,#10b981);box-shadow:0 10px 24px rgba(4,120,87,.35),inset 0 1px 0 rgba(255,255,255,.35);
opacity:0;transform:translateY(-6px) scale(.92);transform-origin:var(--tx,50%) 0;transition:opacity .35s ease,transform .35s ease;pointer-events:none;visibility:hidden}
#bub.show{opacity:1;transform:none;visibility:visible}
#bub::before{content:"";position:absolute;top:-7px;left:calc(var(--tx,40px) - 8px);width:16px;height:16px;background:#0a8a66;transform:rotate(45deg);border-radius:3px}

/* المحتوى تحت الشريط */
#content{position:fixed;inset:0;overflow-y:auto;box-sizing:border-box;z-index:1;padding:calc(env(safe-area-inset-top,0px) + 90px) 12px calc(env(safe-area-inset-bottom,0px) + 24px)}
#banner{display:block;width:100%;height:auto;border-radius:28px;box-shadow:0 10px 24px rgba(2,60,44,.25)}
.sec{display:flex;align-items:center;gap:8px;margin:22px 6px 10px;font-size:18px;font-weight:800;color:#065f46}
.sec::before{content:"";width:5px;height:20px;border-radius:3px;background:linear-gradient(180deg,#10b981,#047857)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;display:flex;align-items:center;gap:6px;height:100px;box-sizing:border-box;padding:8px 8px 8px 10px;border-radius:30px;overflow:hidden;cursor:pointer;color:#fff;font-family:inherit;text-align:center;
background:linear-gradient(135deg,rgba(2,70,52,.94) 0%,rgba(4,110,80,.82) 50%,rgba(3,88,65,.94) 100%);
-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 28px rgba(2,60,44,.35),inset 0 1px 0 rgba(255,255,255,.3);
-webkit-tap-highlight-color:transparent;transition:transform .15s ease}
.tile::before{content:"";position:absolute;left:0;right:0;top:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
.tile:active{transform:scale(.96)}
.tile img{position:relative;flex:none;width:76px;height:80px;object-fit:contain;filter:drop-shadow(0 5px 6px rgba(0,30,20,.45))}
.tile span{position:relative;flex:1;font-weight:800;font-size:15px;line-height:1.35;text-shadow:0 1px 2px rgba(0,60,40,.4)}
.tabs{display:flex;gap:8px;align-items:center;box-sizing:border-box;margin-top:12px;padding:9px 10px;border-radius:30px;overflow-x:auto;overflow-y:hidden;position:relative;scrollbar-width:none;-webkit-overflow-scrolling:touch;
background:linear-gradient(135deg,rgba(2,70,52,.94) 0%,rgba(4,110,80,.82) 50%,rgba(3,88,65,.94) 100%);
-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
border:1px solid rgba(255,255,255,.22);box-shadow:0 12px 28px rgba(2,60,44,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:38px;padding:0 16px;border-radius:19px;border:1px solid rgba(255,255,255,.34);background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));color:#fff;font:700 14px/1 inherit;font-family:inherit;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s ease;text-shadow:0 1px 2px rgba(0,60,40,.35)}
.tab:active{transform:scale(.95)}
.tab.on{background:rgba(255,255,255,.96);color:#047857;border-color:transparent;text-shadow:none;box-shadow:0 3px 8px rgba(0,60,40,.28)}

#scrim{position:fixed;inset:0;z-index:4;display:none}
#scrim.on{display:block}
.glass{background:linear-gradient(135deg,rgba(2,70,52,.94) 0%,rgba(4,110,80,.82) 50%,rgba(3,88,65,.94) 100%);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);border:1px solid rgba(255,255,255,.22);box-shadow:0 14px 30px rgba(2,60,44,.38),inset 0 1px 0 rgba(255,255,255,.3)}
#menu{position:fixed;z-index:6;width:300px;height:150px;border-radius:0 0 150px 150px;overflow:hidden;opacity:0;visibility:hidden;transform:scale(.2);transform-origin:var(--ox,85%) 0;transition:transform .38s cubic-bezier(.2,1.3,.4,1),opacity .25s ease}
#menu.on{opacity:1;visibility:visible;transform:none}
#menu::before{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,0));pointer-events:none}
.mb{position:absolute;display:flex;flex-direction:column;align-items:center;width:84px;transform:translateX(-50%);background:none;border:0;color:#fff;font:800 12.5px/1.2 inherit;font-family:inherit;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 2px rgba(0,60,40,.4)}
.mb .ci{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.96);color:#047857;display:flex;align-items:center;justify-content:center;margin-bottom:4px;box-shadow:0 4px 10px rgba(0,60,40,.3);transition:transform .15s ease}
.mb:active .ci{transform:scale(.9)}
.mb svg,#mx svg,.dx svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#mx{position:absolute;left:130px;top:6px;width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
#mx svg{width:24px;height:24px;stroke-width:2.8}
#dl{position:fixed;z-index:6;left:12px;right:12px;box-sizing:border-box;padding:14px 14px 16px;border-radius:30px;opacity:0;visibility:hidden;transform:translateY(-8px) scale(.96);transform-origin:50% 0;transition:transform .3s ease,opacity .25s ease}
#dl.on{opacity:1;visibility:visible;transform:none}
#dl .hd{display:flex;align-items:center;justify-content:space-between;color:#fff;font-weight:800;font-size:16px}
.dx{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
.gt{margin:12px 2px 8px;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
